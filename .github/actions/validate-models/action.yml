name: 'Validate regression models'
description: 'Validate requested model names against the suite manifest at a given ref'
inputs:
  suite:
    description: 'Test suite (llm_vlm or embodied)'
    required: true
  models:
    description: 'Comma-separated model names'
    required: true
  repository:
    description: 'Full name of the repository holding the manifest (owner/repo)'
    required: true
  ref:
    description: 'Ref (commit SHA) to read the manifest from'
    required: true

runs:
  using: composite
  steps:
    - name: Validate models against suite manifest
      uses: actions/github-script@v7
      env:
        SUITE: ${{ inputs.suite }}
        MODELS: ${{ inputs.models }}
        SOURCE_REPOSITORY: ${{ inputs.repository }}
        SOURCE_REF: ${{ inputs.ref }}
      with:
        script: |
          const suite = process.env.SUITE;
          const models = process.env.MODELS.split(',').map((m) => m.trim()).filter(Boolean);
          if (models.some((model) => !/^[A-Za-z0-9][A-Za-z0-9._/-]*$/.test(model))) {
            core.setFailed('invalid model list');
            return;
          }
          const [owner, repo] = process.env.SOURCE_REPOSITORY.split('/');
          // Validate models against the suite manifest at the requested ref so
          // typos fail before runner time is spent on image pulls, container
          // creation, and a slow regression start.
          let knownModels;
          if (suite === 'embodied') {
            const { data: manifest } = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'tests/embodied/config/scripts.yaml',
              ref: process.env.SOURCE_REF,
            });
            const yaml = Buffer.from(
              manifest.content,
              manifest.encoding || 'base64',
            ).toString('utf8');
            knownModels = new Set(
              [...yaml.matchAll(/^([A-Za-z0-9][A-Za-z0-9_.-]*):(?=\s*\S)/gm)].map((m) => m[1]),
            );
          } else {
            // The llm_vlm regression entry passes only --models, so it can
            // resolve flat names from tests/llm_vlm/configs/ exclusively.
            if (models.some((model) => model.includes('/'))) {
              core.setFailed(
                'llm_vlm model names must not contain "/"; the regression entry searches tests/llm_vlm/configs/ only',
              );
              return;
            }
            const { data: entries } = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'tests/llm_vlm/configs',
              ref: process.env.SOURCE_REF,
            });
            knownModels = new Set(
              entries
                .filter((entry) => entry.type === 'file' && entry.name.endsWith('.yaml'))
                .map((entry) => entry.name.replace(/\.yaml$/, '')),
            );
          }
          const unknownModels = models.filter((model) => !knownModels.has(model));
          if (unknownModels.length) {
            core.setFailed(
              `unknown ${suite} model(s): ${unknownModels.join(', ')}. ` +
                `Choose from: ${[...knownModels].join(', ')}`,
            );
          }
