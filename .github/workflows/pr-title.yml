name: PR Title Check

on:
  workflow_call:

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip outside a pull request
        if: github.event_name != 'pull_request'
        run: echo "PR title validation is only applicable to pull requests."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false

      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        if: github.event_name == 'pull_request'
        with:
          script: |
            const { validatePullRequestTitle } = require('./.github/scripts/pr_title');
            const result = validatePullRequestTitle(context.payload.pull_request?.title || '');
            if (!result.ok) {
              core.setFailed(result.message);
              return;
            }
            const scope = result.scope ? `, scope=${result.scope}` : '';
            const modules = result.modules.length ? `, modules=[${result.modules.join(', ')}]` : '';
            core.info(`OK: type=${result.type}${scope}${modules}`);
