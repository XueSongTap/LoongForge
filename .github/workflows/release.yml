name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch && "$RELEASE_REF" != refs/heads/master ]]; then
            echo "manual releases must be dispatched from master" >&2
            exit 1
          fi
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$EVENT_NAME" == push ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            [[ "$tag_version" == "$package_version" ]] || {
              echo "tag and package versions do not match" >&2
              exit 1
            }
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

  package:
    needs: validate
    uses: ./.github/workflows/build.yml

  publish:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  docker:
    needs: [validate, package, publish]
    if: >-
      ${{
        always() &&
        needs.validate.result == 'success' &&
        needs.package.result == 'success' &&
        (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success')
      }}
    runs-on: ${{ fromJSON(vars.CI_RELEASE_RUNNER) }}
    timeout-minutes: 360
    environment: dockerhub-release
    env:
      IMAGE_REF: docker.io/loongforge/loongforge:${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: LoongForge
          persist-credentials: false
          submodules: recursive
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1
      - name: Verify Docker storage capacity
        shell: bash
        run: |
          set -euo pipefail
          source LoongForge/.github/scripts/load_ci_config.sh
          LoongForge/.github/scripts/check_docker_storage.sh \
            "${LOONGFORGE_MIN_DOCKER_FREE_GB-250}"
      - id: release_image
        name: Build release image with the trusted image builder
        shell: bash
        run: |
          set -euo pipefail
          tree_sha="$(git -C LoongForge rev-parse 'HEAD^{tree}')"
          built_ref="$(LoongForge/.github/scripts/self_runner/build_candidate_image.sh \
            --release \
            --image-ref "$IMAGE_REF" \
            --target auto \
            --sha "$GITHUB_SHA" \
            --tree-sha "$tree_sha" \
            --source "$GITHUB_WORKSPACE/LoongForge")"
          [[ "$built_ref" == "$IMAGE_REF" ]]
          echo "image_ref=$built_ref" >> "$GITHUB_OUTPUT"
      - name: Enforce release image policy
        run: python3 LoongForge/.github/scripts/image_policy.py "${{ steps.release_image.outputs.image_ref }}"
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push immutable release image
        if: github.event_name == 'push'
        run: docker push "${{ steps.release_image.outputs.image_ref }}"
      - name: Remove local release image
        if: always()
        run: docker image rm -f "$IMAGE_REF" >/dev/null 2>&1 || true
