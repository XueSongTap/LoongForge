name: Secret Scan

on:
  workflow_call:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          CHECKSUMS="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -sSLO "${BASE_URL}/${ARCHIVE}"
          curl -sSLO "${BASE_URL}/${CHECKSUMS}"
          grep "${ARCHIVE}" "${CHECKSUMS}" | sha256sum -c -
          tar -xzf "${ARCHIVE}" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks on PR commits
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --verbose --redact

      - name: Run gitleaks on the checked-out branch history
        if: github.event_name != 'pull_request'
        run: |
          # Without --log-opts gitleaks defaults to `git log --all`, which walks
          # every branch fetched by fetch-depth: 0 (gh-pages included) and
          # reports findings this branch does not contain. Passing --log-opts
          # replaces those defaults, so --diff-filter is repeated here.
          gitleaks git --log-opts="--full-history --diff-filter=tuxdb HEAD" --verbose --redact
