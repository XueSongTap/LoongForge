name: GPU Regression

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_repo:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      tree_sha:
        required: false
        default: ''
        type: string
      suite:
        required: true
        type: string
      models:
        required: false
        type: string
      build_image:
        required: false
        default: false
        type: boolean
      gate_check_id:
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  validate:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      tree_sha: ${{ steps.validate.outputs.tree_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - id: validate
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REPO: ${{ inputs.head_repo }}
          HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_TREE_SHA: ${{ inputs.tree_sha }}
          SUITE: ${{ inputs.suite }}
          ENABLE_LLM_VLM: ${{ vars.CI_ENABLE_LLM_VLM }}
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            if (pull.head.sha !== process.env.HEAD_SHA) {
              core.setFailed('the requested revision is no longer the PR head');
              return;
            }
            if (pull.head.repo.full_name !== process.env.HEAD_REPO) {
              core.setFailed('head repository does not match the pull request');
              return;
            }
            if (!['llm_vlm', 'embodied'].includes(process.env.SUITE)) {
              core.setFailed('invalid test suite');
              return;
            }
            if (process.env.SUITE === 'llm_vlm' && process.env.ENABLE_LLM_VLM !== 'true') {
              core.setFailed('the requested GPU suite is disabled by repository configuration');
              return;
            }
            const [headOwner, headRepo] = process.env.HEAD_REPO.split('/');
            const { data: headCommit } = await github.rest.repos.getCommit({
              owner: headOwner,
              repo: headRepo,
              ref: process.env.HEAD_SHA,
            });
            const treeSha = headCommit.commit.tree.sha;
            if (process.env.INPUT_TREE_SHA && process.env.INPUT_TREE_SHA !== treeSha) {
              core.setFailed('tree SHA does not match the immutable head commit');
              return;
            }
            core.setOutput('tree_sha', treeSha);
      - name: Validate models against suite manifest
        uses: ./.github/actions/validate-models
        with:
          suite: ${{ inputs.suite }}
          models: ${{ inputs.models }}
          repository: ${{ inputs.head_repo }}
          ref: ${{ inputs.head_sha }}
          baseline_alias: ${{ inputs.suite == 'embodied' && 'p' || 'a' }}

  llm_vlm:
    needs: validate
    if: ${{ needs.validate.result == 'success' && inputs.suite == 'llm_vlm' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_A) }}
    timeout-minutes: 360
    concurrency:
      group: gpu-regression-${{ inputs.pr_number }}-llm_vlm
      cancel-in-progress: true
    steps:
      - name: Checkout trusted CI scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: trusted-ci
          persist-credentials: false
          submodules: false
      - name: Checkout immutable PR source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.head_repo }}
          ref: ${{ inputs.head_sha }}
          path: source
          persist-credentials: false
          submodules: recursive
      - name: Verify immutable source tree
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          EXPECTED_TREE_SHA: ${{ needs.validate.outputs.tree_sha }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE_SHA"
          test -z "$(git -C source submodule status --recursive | grep -E '^[+-]' || true)"
      - name: Preflight self-hosted runner
        run: trusted-ci/.github/scripts/self_runner/preflight.sh llm_vlm "${{ inputs.build_image && 'true' || 'false' }}"
      - name: Report candidate image build
        if: ${{ inputs.build_image && inputs.gate_check_id != '' }}
        uses: actions/github-script@v7
        env:
          CHECK_ID: ${{ inputs.gate_check_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SUITE: ${{ inputs.suite }}
        with:
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: 'in_progress',
              output: {
                title: 'Building candidate image',
                summary: `PR #${process.env.PR_NUMBER}; suite: ${process.env.SUITE}`,
              },
            });
      - id: candidate
        name: Build candidate image
        if: ${{ inputs.build_image }}
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          TREE_SHA: ${{ needs.validate.outputs.tree_sha }}
          SOURCE_DIR: ${{ github.workspace }}/source
        run: trusted-ci/.github/scripts/build_candidate_image.sh a
      - name: Report regression run
        if: ${{ inputs.gate_check_id != '' }}
        uses: actions/github-script@v7
        env:
          CHECK_ID: ${{ inputs.gate_check_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SUITE: ${{ inputs.suite }}
        with:
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: 'in_progress',
              output: {
                title: `Running ${process.env.SUITE} regression`,
                summary: `PR #${process.env.PR_NUMBER}; suite: ${process.env.SUITE}`,
              },
            });
      - id: regression
        name: Run LLM/VLM regression
        env:
          MODELS: ${{ inputs.models || (inputs.suite == 'embodied' && 'pi05_ddp' || 'deepseek_v2_lite') }}
          CANDIDATE_REVISION: ${{ steps.candidate.outputs.revision }}
          HEAD_SHA: ${{ inputs.head_sha }}
          SOURCE_DIR: ${{ github.workspace }}/source
          LOONGFORGE_REGRESSION_RUNNER: ${{ github.workspace }}/trusted-ci/.github/scripts/self_runner/run_regression.sh
        run: trusted-ci/.github/scripts/run_regression.sh llm_vlm
      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-llm-vlm-${{ inputs.pr_number }}-${{ inputs.head_sha }}
          path: loongforge-artifacts
          if-no-files-found: error
          retention-days: 7

  embodied:
    needs: validate
    if: ${{ needs.validate.result == 'success' && inputs.suite == 'embodied' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_P) }}
    timeout-minutes: 360
    outputs:
      regression_summary: ${{ steps.suite_summary.outputs.markdown }}
    concurrency:
      group: gpu-regression-${{ inputs.pr_number }}-embodied
      cancel-in-progress: true
    steps:
      - name: Checkout trusted CI scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: trusted-ci
          persist-credentials: false
          submodules: false
      - name: Checkout immutable PR source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.head_repo }}
          ref: ${{ inputs.head_sha }}
          path: source
          persist-credentials: false
          submodules: recursive
      - name: Verify immutable source tree
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          EXPECTED_TREE_SHA: ${{ needs.validate.outputs.tree_sha }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE_SHA"
          test -z "$(git -C source submodule status --recursive | grep -E '^[+-]' || true)"
      - name: Preflight self-hosted runner
        run: trusted-ci/.github/scripts/self_runner/preflight.sh embodied "${{ inputs.build_image && 'true' || 'false' }}"
      - name: Report candidate image build
        if: ${{ inputs.build_image && inputs.gate_check_id != '' }}
        uses: actions/github-script@v7
        env:
          CHECK_ID: ${{ inputs.gate_check_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SUITE: ${{ inputs.suite }}
        with:
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: 'in_progress',
              output: {
                title: 'Building candidate image',
                summary: `PR #${process.env.PR_NUMBER}; suite: ${process.env.SUITE}`,
              },
            });
      - id: candidate
        name: Build candidate image
        if: ${{ inputs.build_image }}
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          TREE_SHA: ${{ needs.validate.outputs.tree_sha }}
          SOURCE_DIR: ${{ github.workspace }}/source
        run: trusted-ci/.github/scripts/build_candidate_image.sh p
      - name: Report regression run
        if: ${{ inputs.gate_check_id != '' }}
        uses: actions/github-script@v7
        env:
          CHECK_ID: ${{ inputs.gate_check_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SUITE: ${{ inputs.suite }}
        with:
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: 'in_progress',
              output: {
                title: `Running ${process.env.SUITE} regression`,
                summary: `PR #${process.env.PR_NUMBER}; suite: ${process.env.SUITE}`,
              },
            });
      - id: regression
        name: Run embodied regression
        env:
          MODELS: ${{ inputs.models || (inputs.suite == 'embodied' && 'pi05_ddp' || 'deepseek_v2_lite') }}
          CANDIDATE_REVISION: ${{ steps.candidate.outputs.revision }}
          HEAD_SHA: ${{ inputs.head_sha }}
          SOURCE_DIR: ${{ github.workspace }}/source
          LOONGFORGE_REGRESSION_RUNNER: ${{ github.workspace }}/trusted-ci/.github/scripts/self_runner/run_regression.sh
        run: trusted-ci/.github/scripts/run_regression.sh embodied
      - id: suite_summary
        name: Render suite summary
        # The launcher copies the regression framework's results.json into
        # the artifact directory and exports its path; render it as markdown
        # for the pull request check run. Never blocks the regression result.
        if: ${{ always() && steps.regression.outputs.suite_results != '' }}
        continue-on-error: true
        run: |
          python3 "trusted-ci/.github/scripts/summarize_suite_results.py" \
            "${{ steps.regression.outputs.suite_results }}" > suite-summary.md
          {
            echo 'markdown<<SUITE_SUMMARY_EOF'
            cat suite-summary.md
            echo 'SUITE_SUMMARY_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-embodied-${{ inputs.pr_number }}-${{ inputs.head_sha }}
          path: loongforge-artifacts
          if-no-files-found: error
          retention-days: 7

  finalize:
    timeout-minutes: 70
    needs: [validate, llm_vlm, embodied]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      # Job-level permissions replace the workflow-level set, so re-declare
      # everything this job needs: checkout (contents), the check run
      # (checks), and the summary comment on the pull request
      # (pull-requests).
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - id: cpu_checks
        name: Read CPU check names
        run: echo "names=$(jq -c '.' ci/cpu-checks.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        env:
          CHECK_ID: ${{ inputs.gate_check_id }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          LLM_VLM_RESULT: ${{ needs.llm_vlm.result }}
          EMBODIED_RESULT: ${{ needs.embodied.result }}
          SUITE: ${{ inputs.suite }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CPU_CHECK_NAMES: ${{ steps.cpu_checks.outputs.names }}
          REGRESSION_SUMMARY: ${{ needs.embodied.outputs.regression_summary }}
        with:
          script: |
            const {
              selectLatestChecks,
              shouldPollCpuChecks,
            } = require('./.github/scripts/ci_checks');
            const results = {
              validate: process.env.VALIDATE_RESULT,
              llm_vlm: process.env.LLM_VLM_RESULT,
              embodied: process.env.EMBODIED_RESULT,
            };
            const requiredJobs = ['validate', process.env.SUITE];
            const failed = requiredJobs.filter((name) => results[name] !== 'success');

            // Expected CPU check names come from ci/cpu-checks.json so the
            // finalize job and the CPU gate stay in sync.
            const cpuNames = JSON.parse(process.env.CPU_CHECK_NAMES);
            const pollCpuChecks = shouldPollCpuChecks(results, process.env.SUITE);
            let latestCpuChecks = new Map();
            if (pollCpuChecks) {
              for (let attempt = 0; attempt < 120; attempt += 1) {
                const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: process.env.HEAD_SHA,
                  per_page: 100,
                });
                latestCpuChecks = selectLatestChecks(checkRuns, cpuNames);
                const terminal = cpuNames.every((name) =>
                  latestCpuChecks.get(name)?.status === 'completed'
                );
                if (terminal) break;
                await new Promise((resolve) => setTimeout(resolve, 30000));
              }
            }
            const missingCpu = pollCpuChecks
              ? cpuNames.filter((name) => latestCpuChecks.get(name)?.conclusion !== 'success')
              : [];
            failed.push(...missingCpu.map((name) => `cpu:${name}`));
            const conclusion = pollCpuChecks
              ? (failed.length ? 'failure' : 'success')
              : 'cancelled';
            let checkId = Number(process.env.CHECK_ID);
            if (!Number.isSafeInteger(checkId) || checkId <= 0) {
              const { data: created } = await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'gpu-regression',
                head_sha: process.env.HEAD_SHA,
                external_id: `loongforge-gpu:${process.env.PR_NUMBER}:${process.env.HEAD_SHA}`,
                status: 'in_progress',
                started_at: new Date().toISOString(),
              });
              checkId = created.id;
            }
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: checkId,
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              output: {
                title: conclusion === 'success'
                  ? 'GPU validation passed'
                  : (conclusion === 'cancelled' ? 'GPU validation cancelled' : 'GPU validation failed'),
                summary: `Suite: ${process.env.SUITE}; results: ${JSON.stringify(results)}`,
                // Per-model regression detail (loss baseline comparisons,
                // failed metrics, warnings) rendered by the suite runner.
                // Markdown is supported in the check run output text.
                text: process.env.REGRESSION_SUMMARY || null,
              },
            });

            // Mirror the outcome as a pull request comment from the
            // github-actions bot. A hidden marker keyed by head SHA makes
            // re-runs against the same revision update one comment instead
            // of spamming the conversation.
            const prNumber = Number(process.env.PR_NUMBER);
            if (Number.isSafeInteger(prNumber) && prNumber > 0 && conclusion !== 'cancelled') {
              const marker = `<!-- loongforge-gpu-regression:${process.env.HEAD_SHA} -->`;
              const icon = conclusion === 'success' ? '✅' : '❌';
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const commentBody = [
                marker,
                `### ${icon} GPU regression — ${process.env.SUITE}`,
                '',
                `Verdict: **${conclusion}** · commit \`${process.env.HEAD_SHA.slice(0, 12)}\` · [workflow run](${runUrl})`,
                '',
                process.env.REGRESSION_SUMMARY || 'Per-model detail is unavailable for this suite.',
              ].join('\n');

              const existing = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              });
              const target = existing.find(
                (comment) =>
                  comment.user?.login === 'github-actions[bot]' &&
                  typeof comment.body === 'string' &&
                  comment.body.includes(marker),
              );
              if (target) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: target.id,
                  body: commentBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: commentBody,
                });
              }
            }
            if (conclusion === 'failure') core.setFailed(`failed checks: ${failed.join(', ')}`);
